steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA'
      - 'backend'

  # Fetch the emergency-classifier GGUF (not in git) and build the sidecar image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gsutil
    args: ['cp', 'gs://${_MODELS_BUCKET}/emergency-clf/${_CLF_MODEL}', 'backend/nano/serve/model.gguf']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/nano/serve/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_CLF_IMAGE}:$COMMIT_SHA'
      - 'backend'

  # Push both to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_CLF_IMAGE}:$COMMIT_SHA'

  # Deploy to Cloud Run: backend (ingress, port 8080) + clf sidecar on localhost:8081.
  # The live spec is exported, patched (nano/serve/patch_service.py) and replaced, so every
  # env var / secret stays exactly as deployed. `gcloud run deploy --container` cannot be used:
  # the original container is unnamed and the flag adds a second ingress container instead.
  # Routing stays on keywords until the `emergency_clf_mode` flag is moved off `shadow`.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-ec'
      - |
        gcloud run services describe ${_SERVICE} --region=${_REGION} --format=json > /workspace/svc.json
        python3 backend/nano/serve/patch_service.py /workspace/svc.json \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_CLF_IMAGE}:$COMMIT_SHA > /workspace/svc-new.json
        gcloud run services replace /workspace/svc-new.json --region=${_REGION}

substitutions:
  _REGION: northamerica-northeast1
  _REPO: cozypup
  _IMAGE: backend
  _CLF_IMAGE: emergency-clf
  _SERVICE: backend
  _MODELS_BUCKET: cozypup-models
  _CLF_MODEL: r3-q8.gguf

options:
  logging: CLOUD_LOGGING_ONLY
