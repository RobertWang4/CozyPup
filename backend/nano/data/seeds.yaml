# 紧急路由分类器 — 种子数据（手工标注，老师模型据此扩展）
#
# 任务：给定用户一句话，输出 bool。
#   true  = 切换到高级模型（十分危急，答错代价高）
#   false = 留在日常模型
#
# 判定标准（只有明确危急才 true）：
#   true：危及生命的体征（呼吸困难/抽搐/倒地不起/牙龈发白/大量出血/腹部胀硬/公猫尿不出/中暑）、
#         误食明确有毒或危险物（巧克力大量/葡萄/木糖醇/药片/鼠药/百合/防冻液/针线）、
#         严重外伤（车撞/坠落/咬伤出血不止/大面积烫伤）、
#         症状急剧加重（吐血/拉血+精神差、幼崽或老年动物持续恶化）。
#   false：单一轻微症状、记录、提问、假设、过去的事、别人的宠物（除非正在求助）、闲聊、已在治疗的慢性病。
#   灰区默认 false，用 tags: [gray] 标出，扩展时老师会重点参考。
#
# 风格：大部分是语音转文字或手机随手打的。特征——没标点或标点乱、同音错字、
#   口头禅（那个/就是/然后/呃）、一句话连着说、说一半改口、宠物名识别错、结尾"怎么办呀"。
#   扩展时老师必须模仿这种风格，不要写成书面语。
#
# 字段：msg 原话 / label / tags（给人和老师看，不进模型）/ why 一句理由
# tags 词表：seizure breathing toxin trauma bleeding gdv urinary shock heat neuro panic
#            mild record question past hypothetical other_owner chitchat managed gray typo voice en keyword_trap

