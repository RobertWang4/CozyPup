<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyPup — Login</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  padding: var(--space-8);
  position: relative;
}

/* Decorative organic shapes using existing colors */
.login-screen::before {
  content: '';
  position: absolute;
  top: -80px;
  right: -60px;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, var(--accentSoft) 0%, transparent 70%);
  border-radius: 60% 40% 55% 45%;
  opacity: 0.6;
  animation: float 8s ease-in-out infinite;
}

.login-screen::after {
  content: '';
  position: absolute;
  bottom: -60px;
  left: -40px;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, var(--green-soft) 0%, transparent 70%);
  border-radius: 45% 55% 40% 60%;
  opacity: 0.4;
  animation: float 10s ease-in-out infinite reverse;
}

.logo-area {
  text-align: center;
  margin-bottom: var(--space-12);
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.logo-image {
  width: 100px;
  height: 100px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent) 0%, #D4734A 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto var(--space-6);
  box-shadow: 0 12px 32px rgba(232,131,92,0.2);
  position: relative;
  overflow: hidden;
}
.logo-image::after {
  content: '🐾';
  font-size: 48px;
  filter: grayscale(0.2) brightness(1.1);
}

.logo-area h1 {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -1px;
  margin-bottom: var(--space-2);
}

.logo-area p {
  font-size: 15px;
  color: var(--textSecondary);
  font-weight: 400;
  letter-spacing: 0.2px;
}

.auth-buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.8s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}

.btn-apple {
  width: 100%;
  height: 50px;
  background: var(--text);
  color: var(--surface);
  border: none;
  border-radius: var(--radiusSmall);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  transition: all var(--transition-base);
}
.btn-apple:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-lg);
}
.btn-apple svg { width: 20px; height: 20px; fill: currentColor; }

.btn-google {
  width: 100%;
  height: 50px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radiusSmall);
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  transition: all var(--transition-base);
}
.btn-google:hover {
  background: var(--surface2);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn-google .g-icon {
  width: 20px;
  height: 20px;
  background: var(--text);
  color: var(--surface);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}

.terms {
  text-align: center;
  font-size: 12px;
  color: var(--textTertiary);
  margin-top: var(--space-8);
  line-height: 1.6;
  position: relative;
  z-index: 1;
  animation: fadeIn 1s 0.4s forwards;
  opacity: 0;
}
.terms a {
  color: var(--textSecondary);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Paw prints decoration */
.paw-deco {
  position: absolute;
  opacity: 0.06;
  font-size: 24px;
  z-index: 0;
  animation: float 6s ease-in-out infinite;
}
.paw-deco:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
.paw-deco:nth-child(2) { top: 35%; right: 12%; animation-delay: 1.5s; font-size: 18px; }
.paw-deco:nth-child(3) { bottom: 25%; left: 15%; animation-delay: 3s; font-size: 20px; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">📶 🔋</div>
  </div>

  <div class="screen">
    <div class="login-screen">
      <div class="paw-deco">🐾</div>
      <div class="paw-deco">🐾</div>
      <div class="paw-deco">🐾</div>

      <div class="logo-area">
        <div class="logo-image"></div>
        <h1>CozyPup</h1>
        <p>你的宠物专属管家</p>
      </div>

      <div class="auth-buttons">
        <button class="btn-apple">
          <svg viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.2 0-1.38.62-2.15.53-3.1-.4-3.1-3.03-2.64-8.05 1.1-9.22 1.56-.5 2.85-.17 3.86.3 1.02.48 1.54.42 2.88-.2 2.25-1.08 4.25-.45 5.18 1.3-2.22 1.37-2.02 4.66.36 5.82-.52 1.64-1.14 3.27-2 5zM12.03 7.25c-.07-2.1 1.72-3.93 3.82-4.04.3 2.3-1.92 4.36-3.82 4.04z"/></svg>
          使用 Apple 登录
        </button>
        <button class="btn-google">
          <span class="g-icon">G</span>
          使用 Google 登录
        </button>
      </div>

      <p class="terms">
        继续使用即表示你同意<br>
        <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
      </p>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<nav class="demo-nav">
  <a href="login.html" class="active">登录</a>
  <a href="chat.html">聊天</a>
  <a href="calendar.html">日历</a>
  <a href="settings.html">设置</a>
  <a href="pet-profile.html">宠物</a>
  <a href="cards.html">卡片</a>
</nav>
</body>
</html>
